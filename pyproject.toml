[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boo-gie-ghost-party"
version = "1.1.0"
description = "Procedural ghost party and reproducible transparent spectral skull animation"
requires-python = ">=3.10"
dependencies = ["pygame>=2.6.1,<3", "Pillow>=10.4,<13", "numpy>=1.24,<3", "opencv-python-headless>=4.7,<5", "scipy>=1.10,<2"]

[project.scripts]
ghost-party = "ghost_party.cli:main"
spectral-skull = "spectral_skull.cli:main"

[tool.setuptools.packages.find]
include = ["ghost_party*", "spectral_skull*"]

[tool.setuptools.package-data]
spectral_skull = ["*.jpg"]
